<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --fg2: #6b6b6b;
    --fg3: #999999;
    --line: #cccccc;
    --box-bg: #fafafa;
    --box-stroke: #d4d4d4;
    --fail: #c45c5c;
  }
  text { font-family: "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="540" fill="var(--bg)"/>

<text x="340" y="28" text-anchor="middle" font-size="11" font-weight="500" fill="var(--fg)">JWT authentication flow</text>

<rect x="56" y="46" width="568" height="478" rx="4" fill="none" stroke="var(--line)" stroke-width="0.7" stroke-dasharray="4 3"/>
<text x="72" y="60" font-size="9" fill="var(--fg3)" letter-spacing="0.5">authentication workflow</text>

<text x="174" y="94" text-anchor="end" font-size="9" fill="var(--fg3)">client</text>
<rect x="190" y="76" width="240" height="38" rx="3" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="310" y="90" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--fg)">POST /auth/login</text>
<text x="310" y="104" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">email + password</text>

<line x1="310" y1="114" x2="310" y2="142" stroke="var(--fg2)" stroke-width="0.8" marker-end="url(#a)"/>

<text x="174" y="162" text-anchor="end" font-size="9" fill="var(--fg3)">account-service</text>
<rect x="190" y="144" width="240" height="38" rx="3" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="310" y="158" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--fg)">verify credentials</text>
<text x="310" y="172" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">BCrypt + generate JWT</text>

<line x1="310" y1="182" x2="310" y2="210" stroke="var(--fg2)" stroke-width="0.8" marker-end="url(#a)"/>

<text x="174" y="230" text-anchor="end" font-size="9" fill="var(--fg3)">client</text>
<rect x="190" y="212" width="240" height="38" rx="3" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="310" y="226" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--fg)">receives token</text>
<text x="310" y="240" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">{ "token": "eyJhb..." }</text>

<line x1="310" y1="250" x2="310" y2="278" stroke="var(--fg2)" stroke-width="0.8" marker-end="url(#a)"/>

<text x="174" y="298" text-anchor="end" font-size="9" fill="var(--fg3)">client</text>
<rect x="190" y="280" width="240" height="38" rx="3" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="310" y="294" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--fg)">request + Bearer token</text>
<text x="310" y="308" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">Authorization header</text>

<line x1="310" y1="318" x2="310" y2="346" stroke="var(--fg2)" stroke-width="0.8" marker-end="url(#a)"/>

<text x="174" y="366" text-anchor="end" font-size="9" fill="var(--fg3)">filter chain</text>
<rect x="190" y="348" width="240" height="38" rx="3" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="310" y="362" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--fg)">JwtAuthenticationFilter</text>
<text x="310" y="376" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">validate + extract role</text>

<line x1="430" y1="367" x2="470" y2="367" stroke="var(--fg2)" stroke-width="0.8" marker-end="url(#a)"/>
<text x="450" y="359" text-anchor="middle" font-size="8" fill="var(--fg2)">invalid</text>
<rect x="472" y="348" width="120" height="38" rx="3" fill="var(--box-bg)" stroke="var(--fail)" stroke-width="1.2"/>
<text x="532" y="367" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="var(--fail)">401 / 403</text>

<line x1="310" y1="386" x2="310" y2="414" stroke="var(--fg2)" stroke-width="0.8" marker-end="url(#a)"/>
<text x="322" y="402" font-size="8" fill="var(--fg2)">valid</text>

<rect x="190" y="416" width="240" height="38" rx="3" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="310" y="430" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--fg)">SecurityConfig</text>
<text x="310" y="444" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">check role permissions</text>

<line x1="310" y1="454" x2="310" y2="472" stroke="var(--fg2)" stroke-width="0.8" marker-end="url(#a)"/>

<rect x="190" y="474" width="240" height="38" rx="3" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="310" y="494" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--fg)">controller processes request</text>

<rect x="472" y="408" width="120" height="54" rx="3" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="532" y="424" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="500" fill="var(--fg)">transfer-service</text>
<text x="532" y="440" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">validates token</text>
<text x="532" y="452" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">no user DB</text>

<line x1="430" y1="435" x2="470" y2="435" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="4 3"/>

</svg>

<text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">X-Correlation-Id: abc-123</text>

<line x1="340" y1="250" x2="340" y2="278" stroke="var(--fg2)" stroke-width="0.8" marker-end="url(#a)"/>

<text x="194" y="298" text-anchor="end" font-size="9" fill="var(--fg3)">account-service</text>

<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--fg)">CorrelationIdFilter</text>
<text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">generates abc-123</text>


<text x="549" y="172" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">abc-123</text>

<line x1="470" y1="163" x2="494" y2="163" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="4 3"/>

<line x1="340" y1="182" x2="340" y2="210" stroke="var(--fg2)" stroke-width="0.8" marker-end="url(#a)"/>

<rect x="210" y="212" width="260" height="38" rx="3" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.7"/>

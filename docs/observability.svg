<rect x="494" y="280" width="110" height="38" rx="3" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="549" y="294" text-anchor="middle" dominant-baseline="central" font-size="10" fill="var(--fg)">MDC.put</text>
<text x="549" y="308" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">abc-123</text>

<line x1="470" y1="299" x2="494" y2="299" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="4 3"/>


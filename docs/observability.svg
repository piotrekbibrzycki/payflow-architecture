<text x="82" y="385" dominant-baseline="central" font-size="9" fill="var(--fg3)">transfer-service</text>
<text x="180" y="385" dominant-baseline="central" font-size="9" fill="var(--fg)"> [abc-123] Transfer created: id=1</text>

<rect x="70" y="400" width="540" height="22" rx="2" fill="var(--box-bg)" stroke="var(--box-stroke)" stroke-width="0.5"/>
<text x="82" y="411" dominant-baseline="central" font-size="9" fill="var(--fg3)">account-service</text>
<text x="180" y="411" dominant-baseline="central" font-size="9" fill="var(--fg)"> [abc-123] Balance adjusted: id=2</text>

</svg>

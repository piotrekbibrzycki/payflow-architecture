<text x="340" y="104" text-anchor="middle" dominant-baseline="central" font-size="9" fill="var(--fg3)">no correlation ID</text>

<line x1="340" y1="114" x2="340" y2="142" stroke="var(--fg2)" stroke-width="0.8" marker-end="url(#a)"/>

<text x="194" y="162" text-anchor="end" font-size="9" fill="var(--fg3)">transfer-service</text>

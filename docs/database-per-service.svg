<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 400">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --fg2: #6b6b6b;
    --fg3: #999999;
    --line: #cccccc;
    --box-bg: #fafafa;
    --box-stroke: #d4d4d4;
  }
  text { font-family: "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace; }
  .box { fill: var(--box-bg); stroke: var(--box-stroke); stroke-width: 0.7; rx: 3; }
  .hdr { font-size: 11px; font-weight: 500; fill: var(--fg); }
  .col { font-size: 10px; fill: var(--fg); }
  .type { font-size: 9.5px; fill: var(--fg3); }
  .pk { font-size: 9.5px; fill: var(--fg2); font-weight: bold; }
</style>

<rect width="680" height="400" fill="var(--bg)"/>

<text x="340" y="28" text-anchor="middle" font-size="11" font-weight="500" fill="var(--fg)">database-per-service pattern</text>

<rect x="60" y="60" width="220" height="200" class="box"/>
<path d="M 60 90 L 280 90" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="170" y="76" text-anchor="middle" dominant-baseline="central" class="hdr">account-db (accounts)</text>

<text x="75" y="110" dominant-baseline="central" class="pk">PK</text>
<text x="100" y="110" dominant-baseline="central" class="col">id</text>
<text x="265" y="110" text-anchor="end" dominant-baseline="central" class="type">BIGINT</text>

<text x="100" y="135" dominant-baseline="central" class="col">account_number</text>
<text x="265" y="135" text-anchor="end" dominant-baseline="central" class="type">VARCHAR</text>

<text x="100" y="160" dominant-baseline="central" class="col">owner_name</text>
<text x="265" y="160" text-anchor="end" dominant-baseline="central" class="type">VARCHAR</text>

<text x="100" y="185" dominant-baseline="central" class="col">balance</text>
<text x="265" y="185" text-anchor="end" dominant-baseline="central" class="type">DECIMAL</text>

<text x="100" y="210" dominant-baseline="central" class="col">currency</text>
<text x="265" y="210" text-anchor="end" dominant-baseline="central" class="type">VARCHAR</text>

<text x="100" y="235" dominant-baseline="central" class="col">created_at</text>
<text x="265" y="235" text-anchor="end" dominant-baseline="central" class="type">TIMESTAMP</text>

<rect x="400" y="60" width="220" height="300" class="box"/>
<path d="M 400 90 L 620 90" stroke="var(--box-stroke)" stroke-width="0.7"/>
<text x="510" y="76" text-anchor="middle" dominant-baseline="central" class="hdr">transfer-db (transfers)</text>

<text x="415" y="110" dominant-baseline="central" class="pk">PK</text>
<text x="440" y="110" dominant-baseline="central" class="col">id</text>
<text x="605" y="110" text-anchor="end" dominant-baseline="central" class="type">BIGINT</text>

<text x="440" y="135" dominant-baseline="central" class="col">from_account</text>
<text x="605" y="135" text-anchor="end" dominant-baseline="central" class="type">VARCHAR</text>

<text x="440" y="160" dominant-baseline="central" class="col">to_account</text>
<text x="605" y="160" text-anchor="end" dominant-baseline="central" class="type">VARCHAR</text>

<text x="440" y="185" dominant-baseline="central" class="col">amount</text>
<text x="605" y="185" text-anchor="end" dominant-baseline="central" class="type">DECIMAL</text>

<text x="440" y="210" dominant-baseline="central" class="col">title</text>
<text x="605" y="210" text-anchor="end" dominant-baseline="central" class="type">VARCHAR</text>

<text x="440" y="235" dominant-baseline="central" class="col">currency</text>
<text x="605" y="235" text-anchor="end" dominant-baseline="central" class="type">VARCHAR</text>

<text x="440" y="260" dominant-baseline="central" class="col">status</text>
<text x="605" y="260" text-anchor="end" dominant-baseline="central" class="type">VARCHAR</text>

<text x="440" y="285" dominant-baseline="central" class="col">failure_reason</text>
<text x="605" y="285" text-anchor="end" dominant-baseline="central" class="type">VARCHAR</text>

<text x="440" y="310" dominant-baseline="central" class="col">created_at</text>
<text x="605" y="310" text-anchor="end" dominant-baseline="central" class="type">TIMESTAMP</text>

<text x="440" y="335" dominant-baseline="central" class="col">completed_at</text>
<text x="605" y="335" text-anchor="end" dominant-baseline="central" class="type">TIMESTAMP</text>

<line x1="280" y1="135" x2="400" y2="135" stroke="var(--line)" stroke-width="0.8" stroke-dasharray="4 3"/>
<rect x="305" y="125" width="70" height="20" rx="3" fill="var(--bg)"/>
<text x="340" y="136" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="500" fill="var(--fg2)">REST API</text>

</svg>

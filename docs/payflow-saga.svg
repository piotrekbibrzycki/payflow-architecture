    <path d="M2 2L8 5L2 8" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="480" fill="var(--bg)"/>

<text x="340" y="28" text-anchor="middle" font-size="11" font-weight="500" fill="var(--fg)">saga pattern - transfer flow</text>

<rect x="110" y="50" width="460" height="405" rx="4" fill="none" stroke="var(--line)" stroke-width="0.7" stroke-dasharray="4 3"/>

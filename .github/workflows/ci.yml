name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make Maven wrappers executable
        run: |
          chmod +x account-service/mvnw
          chmod +x transfer-service/mvnw

      - name: Run account-service tests
        working-directory: account-service
        run: ./mvnw -B test

      - name: Run transfer-service tests
        working-directory: transfer-service
        run: ./mvnw -B test

      - name: Install Python dependencies
        run: pip install requests

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for services
        run: sleep 25

      - name: Run smoke tests
        run: python scripts/smoke_test.py

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
